    // --- Utilities ---
    function getTodayDate() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function getDaysUntilDue(dateStr) {
      if (!dateStr) return 0;
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const dueDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
        dueDate.setHours(0, 0, 0, 0);
        const today = getTodayDate();
        return Math.round((dueDate.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
      }
      return 0;
    }

    function getCalibrationAlertInfo(nextDueDate, thresholdDays = 14) {
      const days = getDaysUntilDue(nextDueDate);
      if (days < 0) return { key: 'overdue', label: `OVERDUE (${Math.abs(days)}d ago)`, shortLabel: 'Overdue', days, badgeClass: 'badge-red' };
      if (days === 0) return { key: 'due-urgent', label: `DUE TODAY (${thresholdDays}-Day Window)`, shortLabel: 'Due Today', days, badgeClass: 'badge-red' };
      if (days <= thresholdDays) return { key: 'due-urgent', label: `DUE IN ${days} DAY${days === 1 ? '' : 'S'} (${thresholdDays}-Day Window)`, shortLabel: `Due in ${days}d`, days, badgeClass: 'badge-amber' };
      return { key: 'valid', label: `Compliant (${days} days left)`, shortLabel: 'Compliant', days, badgeClass: 'badge-green' };
    }

    function getNABLAgencyAlertInfo(nablDueDate, thresholdDays = 14) {
      const days = getDaysUntilDue(nablDueDate);
      if (days < 0) return { key: 'expired', label: `NABL ACCREDITATION EXPIRED (${Math.abs(days)}d ago)`, shortLabel: 'Expired', days, badgeClass: 'badge-red' };
      if (days === 0) return { key: 'expiring-soon', label: `NABL SCOPE EXPIRING TODAY`, shortLabel: 'Expiring Today', days, badgeClass: 'badge-amber' };
      if (days <= thresholdDays) return { key: 'expiring-soon', label: `NABL SCOPE EXPIRING IN ${days} DAY${days === 1 ? '' : 'S'}`, shortLabel: `Expiring in ${days}d`, days, badgeClass: 'badge-amber' };
      return { key: 'valid', label: `NABL Accredited (${days} days valid)`, shortLabel: 'Valid', days, badgeClass: 'badge-green' };
    }

    // --- TIMEZONE-SAFE -1 DAY DUE DATE CALCULATOR ---
    function calculateNextDueDate(lastDateStr, months) {
      try {
        if (!lastDateStr) lastDateStr = '2026-01-22';
        const parts = lastDateStr.split('-');
        if (parts.length !== 3) return lastDateStr;

        let year = parseInt(parts[0], 10);
        let month = parseInt(parts[1], 10) - 1;
        let day = parseInt(parts[2], 10);

        const m = parseInt(months || 6, 10);

        const d = new Date(year, month + m, day);
        d.setDate(d.getDate() - 1); // MINUS 1 DAY RULE!

        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');

        return `${yyyy}-${mm}-${dd}`;
      } catch (e) {
        return lastDateStr;
      }
    }

    // --- ROBUST PARSER FOR DD/MM/YYYY, DD-MM-YYYY & EXCEL DATES ---
    function parseExcelDate(val) {
      if (!val) return '2026-01-22';

      if (val instanceof Date && !isNaN(val.getTime())) {
        const yyyy = val.getFullYear();
        const mm = String(val.getMonth() + 1).padStart(2, '0');
        const dd = String(val.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }

      if (typeof val === 'number') {
        const dateObj = new Date((val - (25567 + 2)) * 86400 * 1000);
        if (!isNaN(dateObj.getTime())) {
          const yyyy = dateObj.getFullYear();
          const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
          const dd = String(dateObj.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        }
      }

      const str = val.toString().trim();
      const parts = str.split(/[\/\-\.]/);

      // Explicit DD/MM/YYYY or DD-MM-YYYY (Day/Month/Year standard)
      if (parts.length === 3 && parts[2].length === 4) {
        let p1 = parseInt(parts[0], 10);
        let p2 = parseInt(parts[1], 10);
        let y = parseInt(parts[2], 10);

        if (p1 > 12 && p2 <= 12) {
          return `${y}-${String(p2).padStart(2, '0')}-${String(p1).padStart(2, '0')}`;
        }
        if (p1 <= 31 && p2 <= 12) {
          return `${y}-${String(p2).padStart(2, '0')}-${String(p1).padStart(2, '0')}`;
        }
      }

      // Explicit YYYY-MM-DD
      if (parts.length === 3 && parts[0].length === 4) {
        let y = parseInt(parts[0], 10);
        let m = parseInt(parts[1], 10);
        let d = parseInt(parts[2], 10);
        return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      }

      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        const yyyy = parsed.getFullYear();
        const mm = String(parsed.getMonth() + 1).padStart(2, '0');
        const dd = String(parsed.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }

      return '2026-01-22';
    }

    // --- STANDARD DD/MM/YYYY DISPLAY FORMATTER ---
    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const yyyy = parts[0];
        const mm = parts[1];
        const dd = parts[2];
        
        // Render as DD/MM/YYYY
        return `${dd}/${mm}/${yyyy}`;
      }
      return dateStr;
    }

    // --- PDF TEXT EXTRACTION & METADATA AUTO-CAPTURE ENGINE ---
    async function extractPDFTextFromBuffer(arrayBuffer) {
      try {
        if (typeof pdfjsLib === 'undefined') return '';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        let fullText = '';
        
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += pageText + '\n';
        }
        return fullText;
      } catch (err) {
        console.warn('PDF text extraction notice:', err);
        return '';
      }
    }

    function parsePDFCalibrationMetadata(text, filename, agencies = [], instrument = null) {
      let result = {
        lastCalibratedDate: null,
        nextDueDate: null,
        agencyId: null,
        agencyName: null,
        extractedSummary: []
      };

      const combinedText = (filename || '') + '\n' + (text || '');
      
      // 1. MATCH CALIBRATION DATE
      const calibMatch = combinedText.match(/(?:calibration\s*date|calib\s*date|calib\s*on|date\s*of\s*calibration|done\s*on|cal\s*date)[\s\:\-]*([0-3]?\d[\/\.\-][0-1]?\d[\/\.\-]\d{2,4}|\d{4}[\/\.\-][0-1]?\d[\/\.\-][0-3]?\d)/i);
      if (calibMatch && calibMatch[1]) {
        result.lastCalibratedDate = parseExcelDate(calibMatch[1]);
        result.extractedSummary.push(`Calibration Date: ${result.lastCalibratedDate}`);
      }

      // 2. MATCH DUE DATE
      const dueMatch = combinedText.match(/(?:due\s*date|next\s*due|calib\s*due|expiry\s*date|valid\s*upto|valid\s*until)[\s\:\-]*([0-3]?\d[\/\.\-][0-1]?\d[\/\.\-]\d{2,4}|\d{4}[\/\.\-][0-1]?\d[\/\.\-][0-3]?\d)/i);
      if (dueMatch && dueMatch[1]) {
        result.nextDueDate = parseExcelDate(dueMatch[1]);
        result.extractedSummary.push(`Due Date: ${result.nextDueDate}`);
      }

      // Fallback for dates if explicit keywords were missing
      if (!result.lastCalibratedDate) {
        const allDates = [...combinedText.matchAll(/([0-3]?\d[\/\.\-][0-1]?\d[\/\.\-]\d{4})/g)].map(m => m[1]);
        if (allDates.length > 0) {
          result.lastCalibratedDate = parseExcelDate(allDates[0]);
          result.extractedSummary.push(`Auto-Detected Date: ${result.lastCalibratedDate}`);
          if (allDates.length > 1 && !result.nextDueDate) {
            result.nextDueDate = parseExcelDate(allDates[1]);
            result.extractedSummary.push(`Auto-Detected Due Date: ${result.nextDueDate}`);
          }
        }
      }

      // Default fallback Calibration Date to today if unparseable
      if (!result.lastCalibratedDate) {
        result.lastCalibratedDate = parseExcelDate(new Date());
      }

      // Auto-compute Due Date using -1 Day Rule if not found explicitly
      const freq = instrument ? (instrument.frequencyMonths || 12) : 12;
      if (!result.nextDueDate) {
        result.nextDueDate = calculateNextDueDate(result.lastCalibratedDate, freq);
        result.extractedSummary.push(`Calculated Due Date (-1 Day Rule): ${result.nextDueDate}`);
      }

      // 3. AGENCY MATCHING
      if (agencies && agencies.length > 0) {
        const lowerText = combinedText.toLowerCase();
        for (const ag of agencies) {
          if (
            (ag.name && lowerText.includes(ag.name.toLowerCase())) ||
            (ag.code && lowerText.includes(ag.code.toLowerCase())) ||
            (ag.nablCertNo && lowerText.includes(ag.nablCertNo.toLowerCase()))
          ) {
            result.agencyId = ag.id;
            result.agencyName = ag.name;
            result.extractedSummary.push(`Matched Agency: ${ag.name}`);
            break;
          }
        }
      }

      // Fallback agency
      if (!result.agencyId && instrument && instrument.agencyId) {
        result.agencyId = instrument.agencyId;
        const matched = agencies.find(a => a.id === instrument.agencyId);
        result.agencyName = matched ? matched.name : 'Precision Metrology Services';
      }

      return result;
    }

    function parsePDFAllFields(text, filename, agencies = [], existingInstruments = []) {
      let result = {
        name: 'Measuring Instrument',
        make: 'Mitutoyo',
        serialNo: 'SN-001',
        tagId: '',
        range: '0-150 mm',
        leastCount: '0.01 mm',
        lastCalibratedDate: null,
        nextDueDate: null,
        frequencyMonths: 12,
        historyCardNo: 'HC-2026-001',
        location: 'Quality Inspection Shop',
        agencyId: null,
        agencyName: null,
        category: 'Quality',
        extractedSummary: [],
        isUpdate: false
      };

      const combinedText = (filename || '') + '\n' + (text || '');
      const lowerText = combinedText.toLowerCase();

      // 1. GRS NO / TAG ID / ASSET ID
      const tagMatch = combinedText.match(/(?:grs\s*no|tag\s*id|asset\s*id|gauge\s*no|equipment\s*no|cert\s*no|tag\s*no|asset\s*no|tag)[\s\:\-]*([a-z0-9\/\-\_]+)/i);
      if (tagMatch && tagMatch[1] && tagMatch[1].length >= 3) {
        result.tagId = tagMatch[1].trim();
        result.extractedSummary.push(`GRS NO / Tag ID: ${result.tagId}`);
      } else {
        const grsPattern = combinedText.match(/(?:GRS|EQ|INS|QA|DS|INP)\/[A-Za-z0-9\/\-\_]+/i);
        if (grsPattern) {
          result.tagId = grsPattern[0].trim();
          result.extractedSummary.push(`Detected Tag ID: ${result.tagId}`);
        } else {
          result.tagId = `GRS/QA/${Math.floor(Math.random() * 900 + 100)}`;
          result.extractedSummary.push(`Generated Tag ID: ${result.tagId}`);
        }
      }

      // Check if instrument with this tagId already exists
      const existing = existingInstruments.find(i => i.tagId.toLowerCase().trim() === result.tagId.toLowerCase().trim());
      if (existing) {
        result.isUpdate = true;
        result.name = existing.name;
        result.make = existing.make;
        result.serialNo = existing.serialNo;
        result.range = existing.range;
        result.leastCount = existing.leastCount;
        result.frequencyMonths = existing.frequencyMonths || 12;
        result.historyCardNo = existing.historyCardNo || 'HC-2026-001';
        result.location = existing.location;
        result.agencyId = existing.agencyId;
        result.category = existing.category || 'Quality';
      }

      // 2. INSTRUMENT NAME
      const nameMatch = combinedText.match(/(?:instrument\s*name|gauge\s*name|description|equipment|particulars|item\s*name|item)[\s\:\-]*([^\n\r,;]{3,40})/i);
      if (nameMatch && nameMatch[1]) {
        result.name = nameMatch[1].trim();
        result.extractedSummary.push(`Instrument Name: ${result.name}`);
      } else if (!existing) {
        const knownTypes = [
          "PLUNGER DIAL GAUGE", "LEVER DIAL GAUGE", "DIGITAL HEIGHT GAUGE", "VERNIER HEIGHT GAUGE",
          "Analog Vernier Caliper", "VERNIER CALIPER", "DIGITAL VERNIER CALIPER", "VERNIER DEPTH GAUGE",
          "SURFACE TABLE", "BEVEL PROTRACTOR", "ANALOG MICROMETER", "DIGITAL MICROMETER",
          "Radius Gauge", "Portable Hand Pyrometer", "WEIGHING SCALE", "MAGNETIC V- BLOCK",
          "COATING THICKNESS GAUGE"
        ];
        for (let kt of knownTypes) {
          if (lowerText.includes(kt.toLowerCase())) {
            result.name = kt;
            result.extractedSummary.push(`Detected Instrument: ${result.name}`);
            break;
          }
        }
      }

      // 3. MAKE / MANUFACTURER
      const makeMatch = combinedText.match(/(?:make|manufacturer|brand|mfr)[\s\:\-]*([^\n\r,;]{2,25})/i);
      if (makeMatch && makeMatch[1]) {
        result.make = makeMatch[1].trim();
        result.extractedSummary.push(`Make: ${result.make}`);
      } else if (!existing) {
        const knownMakes = ["Mitutoyo", "Yuri", "Baker", "Insize", "Jafuji", "Tashika", "Luthra", "Samurai", "Essae", "Aqmezzure"];
        for (let km of knownMakes) {
          if (lowerText.includes(km.toLowerCase())) {
            result.make = km;
            result.extractedSummary.push(`Detected Make: ${result.make}`);
            break;
          }
        }
      }

      // 4. SERIAL NO
      const serialMatch = combinedText.match(/(?:serial\s*number|serial\s*no|sr\s*no|sl\s*no|sn|machine\s*no)[\s\:\-]*([a-z0-9\-\_\/]{3,20})/i);
      if (serialMatch && serialMatch[1]) {
        result.serialNo = serialMatch[1].trim();
        result.extractedSummary.push(`Serial No: ${result.serialNo}`);
      }

      // 5. RANGE
      const rangeMatch = combinedText.match(/(?:range|capacity|specification|size)[\s\:\-]*([^\n\r,;]{3,30})/i);
      if (rangeMatch && rangeMatch[1]) {
        result.range = rangeMatch[1].trim();
        result.extractedSummary.push(`Range: ${result.range}`);
      } else if (!existing) {
        const rangePattern = combinedText.match(/\d+(?:\.\d+)?\s*[\-\x\×x]\s*\d+(?:\.\d+)?\s*(?:mm|cm|m|kg|kgs|degree\s*c|°c)/i);
        if (rangePattern) {
          result.range = rangePattern[0].trim();
          result.extractedSummary.push(`Detected Range: ${result.range}`);
        }
      }

      // 6. LEAST COUNT
      const lcMatch = combinedText.match(/(?:least\s*count|resolution|accuracy|lc)[\s\:\-]*([^\n\r,;]{2,20})/i);
      if (lcMatch && lcMatch[1]) {
        result.leastCount = lcMatch[1].trim();
        result.extractedSummary.push(`Least Count: ${result.leastCount}`);
      }

      // 7. CALIBRATION ON DATE
      const calibMatch = combinedText.match(/(?:calibration\s*date|calib\s*date|calib\s*on|date\s*of\s*calibration|done\s*on|cal\s*date)[\s\:\-]*([0-3]?\d[\/\.\-][0-1]?\d[\/\.\-]\d{2,4}|\d{4}[\/\.\-][0-1]?\d[\/\.\-][0-3]?\d)/i);
      if (calibMatch && calibMatch[1]) {
        result.lastCalibratedDate = parseExcelDate(calibMatch[1]);
        result.extractedSummary.push(`Calib On Date: ${result.lastCalibratedDate}`);
      } else {
        const allDates = [...combinedText.matchAll(/([0-3]?\d[\/\.\-][0-1]?\d[\/\.\-]\d{4})/g)].map(m => m[1]);
        if (allDates.length > 0) {
          result.lastCalibratedDate = parseExcelDate(allDates[0]);
          result.extractedSummary.push(`Detected Date: ${result.lastCalibratedDate}`);
        }
      }
      if (!result.lastCalibratedDate) {
        result.lastCalibratedDate = parseExcelDate(new Date());
      }

      // 8. FREQUENCY MONTHS
      const freqMatch = combinedText.match(/(?:frequency|periodicity|interval)[\s\:\-]*(\d+)\s*(?:months|month|m)?/i);
      if (freqMatch && freqMatch[1]) {
        result.frequencyMonths = parseInt(freqMatch[1], 10);
        result.extractedSummary.push(`Frequency: ${result.frequencyMonths} Months`);
      }

      // 9. DUE DATE (-1 DAY RULE APPLIED)
      const dueMatch = combinedText.match(/(?:due\s*date|next\s*due|calib\s*due|expiry\s*date|valid\s*upto|valid\s*until)[\s\:\-]*([0-3]?\d[\/\.\-][0-1]?\d[\/\.\-]\d{2,4}|\d{4}[\/\.\-][0-1]?\d[\/\.\-][0-3]?\d)/i);
      if (dueMatch && dueMatch[1]) {
        result.nextDueDate = parseExcelDate(dueMatch[1]);
        result.extractedSummary.push(`Due Date: ${result.nextDueDate}`);
      } else {
        result.nextDueDate = calculateNextDueDate(result.lastCalibratedDate, result.frequencyMonths);
        result.extractedSummary.push(`Calculated Due Date (-1 Day Rule): ${result.nextDueDate}`);
      }

      // 10. HISTORY CARD NO
      const hcMatch = combinedText.match(/(?:history\s*card\s*no|history\s*card|hc\s*no|hc)[\s\:\-]*([a-z0-9\-\_]{3,20})/i);
      if (hcMatch && hcMatch[1]) {
        result.historyCardNo = hcMatch[1].trim();
        result.extractedSummary.push(`History Card No: ${result.historyCardNo}`);
      }

      // 11. LOCATION
      const locMatch = combinedText.match(/(?:location|shop|department|area|plant)[\s\:\-]*([^\n\r,;]{3,30})/i);
      if (locMatch && locMatch[1]) {
        result.location = locMatch[1].trim();
        result.extractedSummary.push(`Location: ${result.location}`);
      }

      // 12. AGENCY MATCHING
      if (agencies && agencies.length > 0) {
        for (const ag of agencies) {
          if (
            (ag.name && lowerText.includes(ag.name.toLowerCase())) ||
            (ag.code && lowerText.includes(ag.code.toLowerCase())) ||
            (ag.nablCertNo && lowerText.includes(ag.nablCertNo.toLowerCase()))
          ) {
            result.agencyId = ag.id;
            result.agencyName = ag.name;
            result.extractedSummary.push(`Matched Agency: ${ag.name}`);
            break;
          }
        }
      }
      if (!result.agencyId && agencies.length > 0) {
        result.agencyId = agencies[0].id;
        result.agencyName = agencies[0].name;
      }

      return result;
    }

    // --- SAFE STORAGE CONTROLLER ---
    const StorageManager = {
      get: (key, def) => { 
        try { 
          const currentVersion = localStorage.getItem('calibguard_data_ver');
          if (currentVersion !== DATA_VERSION) {
            localStorage.setItem('calibguard_data_ver', DATA_VERSION);
            localStorage.removeItem('calibguard_instruments');
            StorageManager.set('instruments', INITIAL_INSTRUMENTS);
            if (key === 'instruments') {
              return INITIAL_INSTRUMENTS;
            }
          }

          const item = localStorage.getItem(`calibguard_${key}`); 
          if (item) {
            const parsed = JSON.parse(item);
            if (Array.isArray(parsed) && parsed.length > 0) {
              if (key === 'agencies') {
                return parsed.map(a => ({
                  id: a.id || `AGN-${Math.random()}`,
                  name: a.name || 'Calibration Laboratory',
                  code: a.code || 'LAB-001',
                  contactPerson: a.contactPerson || 'Laboratory Incharge',
                  phone: a.phone || '+1 (555) 000-0000',
                  email: a.email || 'info@caliblab.com',
                  accreditation: a.accreditation || 'ISO/IEC 17025 Accredited (NABL)',
                  nablCertNo: a.nablCertNo || 'NABL-CC-2894',
                  nablDueDate: a.nablDueDate || '2026-08-15',
                  nablScopeName: a.nablScopeName || null,
                  nablScopeData: a.nablScopeData || null,
                  status: a.status || 'Active'
                }));
              }
              if (key === 'instruments') {
                return parsed.map((ins, index) => {
                  let mappedCat = ins.category || 'Quality';
                  if (!ALLOWED_CATEGORIES.includes(mappedCat)) {
                    if (mappedCat.toLowerCase().includes('heat')) mappedCat = 'Heat Treatment';
                    else if (mappedCat.toLowerCase().includes('mpi')) mappedCat = 'MPI';
                    else if (mappedCat.toLowerCase().includes('prod')) mappedCat = 'Production';
                    else mappedCat = 'Quality';
                  }

                  const calDate = ins.lastCalibratedDate || '2026-01-22';
                  const freq = parseInt(ins.frequencyMonths || 6, 10);
                  const computedDue = calculateNextDueDate(calDate, freq);

                  return {
                    ...ins,
                    category: mappedCat,
                    lastCalibratedDate: calDate,
                    frequencyMonths: freq,
                    nextDueDate: computedDue
                  };
                });
              }
              return parsed;
            }
          }
          return def; 
        } catch (e) { 
          return def; 
        } 
      },
      set: (key, val) => { 
        try { 
          localStorage.setItem(`calibguard_${key}`, JSON.stringify(val)); 
        } catch (e) { 
          console.warn(`localStorage quota error, stripping binary attachments for ${key}`);
          try {
            const cleanVal = JSON.parse(JSON.stringify(val, (k, v) => (k === 'pdfReportData' || k === 'nablScopeData') ? null : v));
            localStorage.setItem(`calibguard_${key}`, JSON.stringify(cleanVal));
          } catch (err) {
            console.error('Storage failed', err);
          }
        } 
      }
    };

      getActiveUser() {
        return this.state.users.find(u => u.id === this.state.activeUserId) || this.state.users[0];
      }

      // --- PERMISSION CHECK ENGINE ---
      hasPermission(action) {
        const user = this.getActiveUser();
        const isAdmin = (user.role === 'Admin' || user.username === 'Mukunda');
        
        if (isAdmin) return true;

        if (action === 'edit_instrument' || action === 'delete_instrument' || action === 'manage_users' || action === 'edit_user_access' || action === 'edit_agency' || action === 'reset_seed') {
          return false;
        }

        const p = user.permissions || {};

        if (p.accessLevel === 'view' || p.readOnlyMode) {
          if (action === 'view_dashboard' || action === 'view_master' || action === 'view_alerts' || action === 'view_agencies' || action === 'view_pdf' || action === 'export_backup') return true;
          return false;
        }

        if (action === 'add_instrument') return !!p.canAddInstruments;
        if (action === 'upload_excel') return !!p.canUploadExcel;
        if (action === 'upload_pdf') return !!p.canUploadPDF;

        return true;
      }

      saveState(k, showToastMsg = true) {
        StorageManager.set(k, this.state[k]);
        if (showToastMsg) showToast(`&#9989; Data Saved to Browser Storage!`);
      }

      saveAllData() {
        StorageManager.set('instruments', this.state.instruments);
        StorageManager.set('agencies', this.state.agencies);
        StorageManager.set('users', this.state.users);
        StorageManager.set('alertThresholdDays', this.state.alertThresholdDays);
        showToast('&#128190; All Master Data & Calibration Agencies Saved Successfully!');

      importBackupJSON(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.instruments && Array.isArray(data.instruments)) {
              this.state.instruments = data.instruments.map(ins => ({
                ...ins,
                nextDueDate: calculateNextDueDate(ins.lastCalibratedDate, ins.frequencyMonths)
              }));
              StorageManager.set('instruments', this.state.instruments);

            if (data.agencies && Array.isArray(data.agencies)) {
              this.state.agencies = data.agencies;
              StorageManager.set('agencies', this.state.agencies);
            }
            if (data.users && Array.isArray(data.users)) {

              StorageManager.set('users', this.state.users);

      getFilteredInstruments() {
        const user = this.getActiveUser();
        const query = (this.state.searchQuery || '').toLowerCase().trim();
        const cat = this.state.filterCategory || 'All';
        const stat = this.state.filterStatus || 'All';
        const threshold = this.state.alertThresholdDays;

        return this.state.instruments.filter(ins => {
          if (user.role === 'AgencyRep' && user.assignedAgencyId) {
            if (ins.agencyId !== user.assignedAgencyId) return false;
          }

          const agency = this.state.agencies.find(a => a.id === ins.agencyId);
          const agencyName = agency ? agency.name.toLowerCase() : '';
          const agencyCode = agency ? agency.code.toLowerCase() : '';

          const calDateFormatted = formatDate(ins.lastCalibratedDate).toLowerCase();
          const dueDateFormatted = formatDate(ins.nextDueDate).toLowerCase();

          const matchesQuery = !query || 
            (ins.tagId && ins.tagId.toLowerCase().includes(query)) ||
            (ins.historyCardNo && ins.historyCardNo.toLowerCase().includes(query)) ||
            (ins.name && ins.name.toLowerCase().includes(query)) ||
            (ins.make && ins.make.toLowerCase().includes(query)) ||
            (ins.serialNo && ins.serialNo.toLowerCase().includes(query)) ||
            (ins.range && ins.range.toLowerCase().includes(query)) ||
            (ins.leastCount && ins.leastCount.toLowerCase().includes(query)) ||
            (ins.category && ins.category.toLowerCase().includes(query)) ||
            (ins.location && ins.location.toLowerCase().includes(query)) ||
            calDateFormatted.includes(query) ||
            dueDateFormatted.includes(query) ||
            agencyName.includes(query) ||
            agencyCode.includes(query);

          const matchesCat = (cat === 'All') || (ins.category === cat);

          const alertInfo = getCalibrationAlertInfo(ins.nextDueDate, threshold);
          const matchesStat = (stat === 'All') || 
            (stat === 'Overdue' && alertInfo.key === 'overdue') ||
            (stat === 'Urgent' && alertInfo.key === 'due-urgent') ||
            (stat === 'Compliant' && alertInfo.key === 'valid');

          return matchesQuery && matchesCat && matchesStat;
        });
      }

      // --- EXCEL UPLOAD PARSER (SUPPORTING DD/MM/YYYY FORMAT) ---
      handleExcelUpload(file) {
        if (!this.hasPermission('upload_excel')) {
          alert('Access Denied: Your account role does not have permission to upload Excel sheets.');
          return;
        }
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (!rawRows || rawRows.length === 0) {
              alert('Uploaded Excel sheet is empty! Please check your file.');
              return;
            }

            const findValue = (row, patterns) => {
              const keys = Object.keys(row);
              for (let pattern of patterns) {
                const foundKey = keys.find(k => k.toString().toLowerCase().trim().replace(/[^a-z0-9]/g, '') === pattern);
                if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null && row[foundKey] !== '') {
                  return row[foundKey];
                }
              }
              return '';
            };

            let updatedCount = 0;
            let addedCount = 0;
            const importedTags = [];

            rawRows.forEach((row, idx) => {
              const tagIdVal = findValue(row, ['tagid', 'tag', 'assetid', 'asset', 'tagassetid', 'tagno', 'equipmentid', 'equipmentno', 'eqid', 'eqno', 'gaugeid', 'gaugeno', 'id', 'code', 'assetno', 'tagasset']);
              const nameVal = findValue(row, ['instrumentname', 'name', 'instrument', 'description', 'gaugename', 'equipmentname', 'title', 'particulars', 'item', 'itemname', 'equipment']);
              
              if (!tagIdVal && !nameVal) return;

              const tagId = (tagIdVal || `EQ-IMP-${Date.now()}-${idx}`).toString().trim();
              const historyCardNo = (findValue(row, ['historycardno', 'historycard', 'historycardnum', 'historycardnumber', 'hcno', 'hcnumber', 'cardno', 'cardnumber', 'historyno', 'history', 'hcardno', 'hcard']) || `HC-2026-${(idx + 101)}`).toString().trim();
              const name = (nameVal || 'Measuring Instrument').toString().trim();
              const make = (findValue(row, ['make', 'makebrand', 'brand', 'manufacturer', 'company', 'mfr', 'makeofinstrument']) || 'Mitutoyo').toString().trim();
              const serialNo = (findValue(row, ['serialnumber', 'serialno', 'serial', 'slno', 'srno', 'sn', 'machineno', 'srnumber', 'slnumber', 'sno', 'serialnum']) || 'SN-000').toString().trim();
              const range = (findValue(row, ['range', 'capacity', 'specification', 'size', 'rangespecification', 'measuringrange']) || '0-150 mm').toString().trim();
              const leastCount = (findValue(row, ['leastcount', 'lc', 'resolution', 'accuracy', 'leastcountlc', 'lcount']) || '0.01 mm').toString().trim();
              
              let rawCategory = (findValue(row, ['category', 'type', 'discipline', 'dept', 'department', 'cat', 'process']) || 'Quality').toString().trim();
              let categoryVal = 'Quality';
              const catLower = rawCategory.toLowerCase();
              if (catLower.includes('mpi') || catLower.includes('magnetic') || catLower.includes('flaw') || catLower.includes('yoke') || catLower.includes('ultrasonic')) {
                categoryVal = 'MPI';
              } else if (catLower.includes('heat') || catLower.includes('furnace') || catLower.includes('temp') || catLower.includes('therm') || catLower.includes('oven') || catLower.includes('quench') || catLower.includes('anneal')) {
                categoryVal = 'Heat Treatment';
              } else if (catLower.includes('prod') || catLower.includes('press') || catLower.includes('line') || catLower.includes('forge') || catLower.includes('hydraul')) {
                categoryVal = 'Production';
              } else {
                categoryVal = 'Quality';
              }

              const location = (findValue(row, ['location', 'locationshop', 'shop', 'area', 'department', 'plant', 'locationdept', 'place', 'workstation', 'line']) || 'Quality Inspection Shop').toString().trim();
              
              // CALIBRATION ON DATE: Parsed cleanly from DD/MM/YYYY or DD-MM-YYYY Excel strings
              const rawCalDate = findValue(row, ['calibrationondate', 'calibrationdate', 'lastcalibrateddate', 'caldate', 'calibratedon', 'dateofcalibration', 'lastcalibrationdate', 'lastcaldate', 'calondate', 'date']);
              const lastCal = parseExcelDate(rawCalDate);

              // FREQUENCY
              const freqRaw = findValue(row, ['frequencymonths', 'frequency', 'freq', 'frequencyinmonths', 'periodicity', 'interval', 'months', 'calfrequency', 'calibfrequency']);
              const freq = parseInt(freqRaw || '6', 10);

              // AGENCY
              const agencyCodeVal = findValue(row, ['agencycode', 'agency', 'calibrationagency', 'lab', 'calibratedby', 'agencyname', 'supplier', 'vendor', 'callab', 'externalagency']);
              let agency = this.state.agencies.find(a => 
                a.code.toLowerCase() === agencyCodeVal.toString().toLowerCase() || 
                a.name.toLowerCase() === agencyCodeVal.toString().toLowerCase() ||
                a.name.toLowerCase().includes(agencyCodeVal.toString().toLowerCase())
              );
              if (!agency) agency = this.state.agencies[0];

              // DUE DATE: CALIBRATION DATE + FREQUENCY MONTHS - 1 DAY
              const nextDue = calculateNextDueDate(lastCal, freq);

              const existingIdx = this.state.instruments.findIndex(i => i.tagId.toLowerCase() === tagId.toLowerCase());

              if (existingIdx >= 0) {
                this.state.instruments[existingIdx] = {
                  ...this.state.instruments[existingIdx],
                  tagId: tagId,
                  historyCardNo: historyCardNo,
                  name: name,
                  make: make,
                  serialNo: serialNo,
                  range: range,
                  leastCount: leastCount,
                  category: categoryVal,
                  location: location,
                  frequencyMonths: freq,
                  lastCalibratedDate: lastCal,
                  nextDueDate: nextDue,
                  agencyId: agency.id
                };
                updatedCount++;
                importedTags.push(`${tagId} (${name}) - Calib: ${formatDate(lastCal)} -> Due: ${formatDate(nextDue)}`);
              } else {
                this.state.instruments.unshift({
                  id: `INS-${Date.now()}-${idx}`,
                  tagId: tagId,
                  historyCardNo: historyCardNo,
                  name: name,
                  make: make,
                  serialNo: serialNo,
                  range: range,
                  leastCount: leastCount,
                  category: categoryVal,
                  location: location,
                  frequencyMonths: freq,
                  lastCalibratedDate: lastCal,
                  nextDueDate: nextDue,
                  agencyId: agency.id,
                  status: 'Active',
                  pdfReportName: null
                });
                addedCount++;
                importedTags.push(`${tagId} (${name}) - Calib: ${formatDate(lastCal)} -> Due: ${formatDate(nextDue)}`);
              }
            });

            this.saveState('instruments');
            this.openExcelUploadResultModal(updatedCount, addedCount, importedTags);
            this.renderCurrentTab();
          } catch (err) {
            alert('Error parsing Excel sheet: ' + err.message);
          }
        };
        reader.readAsArrayBuffer(file);
      }

      bindEvents() {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', (e) => this.switchTab(e.currentTarget.dataset.tab)));
        document.getElementById('quickAlertBtn')?.addEventListener('click', () => this.switchTab('alerts'));
        document.getElementById('btnResetSeedData')?.addEventListener('click', () => this.resetToDefaultSeed());
        document.getElementById('btnHeaderResetSeed')?.addEventListener('click', () => this.resetToDefaultSeed());

        const jsonInput = document.getElementById('jsonFileInput');
        
        document.getElementById('btnHeaderExportJSON')?.addEventListener('click', () => this.exportBackupJSON());
        document.getElementById('btnSidebarExportJSON')?.addEventListener('click', () => this.exportBackupJSON());
        
        document.getElementById('btnHeaderImportJSON')?.addEventListener('click', () => jsonInput?.click());

        jsonInput?.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            this.importBackupJSON(file);
            e.target.value = '';
          }
        });

        document.getElementById('globalThresholdSelect')?.addEventListener('change', (e) => {
          this.state.alertThresholdDays = parseInt(e.target.value, 10);
          this.saveState('alertThresholdDays');
          this.updateGlobalBadges();
          this.renderCurrentTab();
        });

        document.getElementById('btnLogout')?.addEventListener('click', () => {
          this.state.isLoggedIn = false;
          this.saveState('isLoggedIn', false);
          this.renderLoginScreen();
        });

        const excelInput = document.getElementById('excelFileInput');
        const globalPdfInput = document.getElementById('globalPdfFileInput');
        
        document.getElementById('btnHeaderUploadExcel')?.addEventListener('click', () => excelInput?.click());
        document.getElementById('btnHeaderUploadPDF')?.addEventListener('click', () => globalPdfInput?.click());
        document.getElementById('btnTriggerExcelUpload')?.addEventListener('click', () => excelInput?.click());
        document.getElementById('btnDownloadTemplate')?.addEventListener('click', () => downloadExcelTemplate());

        excelInput?.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            this.handleExcelUpload(file);
            e.target.value = '';
          }
        });

        globalPdfInput?.addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;

          showToast(`&#9251; Extracting All 11 Fields from PDF "${file.name}"...`);

          let pdfText = '';
          try {
            const arrayBuffer = await file.arrayBuffer();
            pdfText = await extractPDFTextFromBuffer(arrayBuffer);
          } catch (err) {
            console.warn('PDF Buffer Read Notice:', err);
          }

          const reader = new FileReader();
          reader.onload = (evt) => {
            const pdfDataUrl = evt.target.result;
            const metadata = parsePDFAllFields(pdfText, file.name, this.state.agencies, this.state.instruments);
            this.openGlobalPDFUploadModal(metadata, pdfDataUrl, file.name);
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        });
      }

      updateGlobalBadges() {
        const threshold = this.state.alertThresholdDays;
        const dueUrgentCount = this.state.instruments.filter(i => { const d = getDaysUntilDue(calculateNextDueDate(i.lastCalibratedDate, i.frequencyMonths)); return d >= 0 && d <= threshold; }).length;
        const overdueCount = this.state.instruments.filter(i => getDaysUntilDue(calculateNextDueDate(i.lastCalibratedDate, i.frequencyMonths)) < 0).length;
        const nablAlertCount = this.state.agencies.filter(a => { const d = getDaysUntilDue(a.nablDueDate); return d <= threshold; }).length;

        const total = dueUrgentCount + overdueCount + nablAlertCount;
        const badge = document.getElementById('urgentAlertCountBadge');
        if (badge) badge.innerText = total;
      }

      switchTab(tab) {
        this.state.activeTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('nav-tab-active', b.dataset.tab === tab));
        this.renderCurrentTab();
      }

      renderCurrentTab() {
        const c = document.getElementById('tabContent');
        c.innerHTML = '';
        if (this.state.activeTab === 'master') this.renderMasterList(c);
        else if (this.state.activeTab === 'alerts') this.renderAlerts(c);
        else if (this.state.activeTab === 'agencies') this.renderAgencies(c);
        else if (this.state.activeTab === 'users') this.renderUsers(c);
        else this.renderDashboard(c);
        this.updateGlobalBadges();

      bindRowActions(c, isAdmin) {
        if (isAdmin) {
          c.querySelectorAll('.btnEditIns').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const insId = e.currentTarget.dataset.insId;
              this.openEditInstrumentModal(insId);
            });
          });

          c.querySelectorAll('.btnDeleteIns').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const insId = e.currentTarget.dataset.insId;
              if (confirm(`Are you sure you want to delete instrument ${insId}?`)) {
                this.state.instruments = this.state.instruments.filter(i => i.id !== insId);
                this.saveState('instruments');
                this.renderCurrentTab();
              }
            });
          });
        }

        c.querySelectorAll('.btnViewPDF').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const insId = e.currentTarget.dataset.insId;
            this.openPDFReportViewer(insId);
          });
        });

        const pdfInput = document.getElementById('pdfReportFileInput');
        let currentUploadInsId = null;

        c.querySelectorAll('.btnUploadPDF').forEach(btn => {
          btn.addEventListener('click', (e) => {
            currentUploadInsId = e.currentTarget.dataset.insId;
            pdfInput.click();
          });
        });

        pdfInput.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file || !currentUploadInsId) return;

          const ins = this.state.instruments.find(i => i.id === currentUploadInsId);
          if (!ins) return;

          showToast(`⏳ Extracting Metadata from PDF "${file.name}"...`);

          let pdfText = '';
          try {
            const arrayBuffer = await file.arrayBuffer();
            pdfText = await extractPDFTextFromBuffer(arrayBuffer);
          } catch (err) {
            console.warn('PDF Buffer Read Notice:', err);
          }

          const reader = new FileReader();
          reader.onload = (evt) => {
            const pdfDataUrl = evt.target.result;
            const metadata = parsePDFCalibrationMetadata(pdfText, file.name, this.state.agencies, ins);
            this.openPDFAutoCaptureModal(ins, metadata, pdfDataUrl, file.name);
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        };
      }

      buildSMSAlertText(overdue, urgent, targetPhone = '7975635973') {
        const todayFormatted = formatDate(parseExcelDate(new Date()));
        let msg = `🚨 CALIBGUARD SYSTEM ALERT 🚨\nTarget Recipient: ${targetPhone}\nDate: ${todayFormatted}\n\n`;
        
        msg += `⚠️ PENDING / OVERDUE CALIBRATIONS (${overdue.length}):\n`;
        if (overdue.length === 0) {
          msg += `(None - All instruments up to date)\n`;
        } else {
          overdue.forEach((ins, idx) => {
            const computedDue = calculateNextDueDate(ins.lastCalibratedDate, ins.frequencyMonths);
            const days = Math.abs(getDaysUntilDue(computedDue));
            msg += `${idx + 1}. [${ins.tagId}] ${ins.name} | Calib On: ${formatDate(ins.lastCalibratedDate)} | Due: ${formatDate(computedDue)} (${days} Days OVERDUE)\n`;
          });
        }

        msg += `\n📅 DUE IN NEXT 14 DAYS (${urgent.length}):\n`;
        if (urgent.length === 0) {
          msg += `(None - No instruments due in next 14 days)\n`;
        } else {
          urgent.forEach((ins, idx) => {
            const computedDue = calculateNextDueDate(ins.lastCalibratedDate, ins.frequencyMonths);
            const days = getDaysUntilDue(computedDue);
            msg += `${idx + 1}. [${ins.tagId}] ${ins.name} | Due: ${formatDate(computedDue)} (in ${days} Days)\n`;
          });
        }

        msg += `\n❗ Please complete calibration & update system records to clear these alerts.`;
        return msg;
      }

                  </label>

                  <label class="p-3 rounded-xl border flex items-center space-x-3 cursor-pointer transition-all ${currentLevel === 'modification' ? 'bg-amber-50 border-amber-400' : 'bg-white border-slate-200'}">
                    <input type="radio" name="radAccessLevel" value="modification" ${currentLevel === 'modification' ? 'checked' : ''} class="w-4 h-4 text-amber-600">
                    <div>
                      <strong class="text-amber-900 block font-bold">&#9999;&#65039; Limited Access (Add & Upload)</strong>
                      <span class="text-slate-600 text-[11px]">Can add new instruments & upload PDF reports. (Edit & Delete Master Instruments is Restricted to Admin Only).</span>
                    </div>
                  </label>

                  <label class="p-3 rounded-xl border flex items-center space-x-3 cursor-pointer transition-all ${currentLevel === 'admin' ? 'bg-emerald-50 border-emerald-400' : 'bg-white border-slate-200'}">
                    <input type="radio" name="radAccessLevel" value="admin" ${currentLevel === 'admin' ? 'checked' : ''} class="w-4 h-4 text-emerald-600">
                    <div>
                      <strong class="text-emerald-900 block font-bold">&#128081; Full Admin Control (Mukunda)</strong>
                      <span class="text-slate-600 text-[11px]">Unrestricted access: Edit & Delete master instruments, batch upload Excel, edit agencies & manage user access.</span>
                    </div>
                  </label>
                </div>
              </div>

              <div class="flex justify-end space-x-2 pt-2 border-t border-slate-200">
                <button type="button" onclick="document.getElementById('modalContainer').classList.add('hidden')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 border border-slate-200 font-bold">
                  Cancel
                </button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-md">
                  &#128190; Save User Access Level
                </button>
              </div>
            </form>
          </div>
        `;

        document.getElementById('editUserAccessForm').addEventListener('submit', (e) => {
          e.preventDefault();

          const selectedLevel = document.querySelector('input[name="radAccessLevel"]:checked')?.value || 'modification';

          user.name = document.getElementById('euName').value.trim();
          user.username = document.getElementById('euUsername').value.trim();
          user.password = document.getElementById('euPassword').value.trim();

          if (selectedLevel === 'admin') {
            user.role = 'Admin';
            user.permissions = {
              accessLevel: 'admin',
              canAddInstruments: true,
              canEditInstruments: true,
              canDeleteInstruments: true,
              canUploadExcel: true,
              canUploadPDF: true,
              canEditAgencies: true,
              canManageUsers: true,
              readOnlyMode: false
            };
          } else if (selectedLevel === 'modification') {
            user.role = 'Technician';
            user.permissions = {
              accessLevel: 'modification',
              canAddInstruments: true,
              canEditInstruments: false,
              canDeleteInstruments: false,
              canUploadExcel: true,
              canUploadPDF: true,
              canEditAgencies: false,
              canManageUsers: false,
              readOnlyMode: false
            };
          } else {
            user.role = 'Auditor';
            user.permissions = {
              accessLevel: 'view',
              canAddInstruments: false,
              canEditInstruments: false,
              canDeleteInstruments: false,
              canUploadExcel: false,
              canUploadPDF: false,
              canEditAgencies: false,
              canManageUsers: false,
              readOnlyMode: true
            };
          }

          this.saveState('users');
          showToast(`&#128190; Access Level set to "${selectedLevel.toUpperCase()}" for user "${user.name}"!`);
          m.classList.add('hidden');
          this.renderCurrentTab();
        });
      }

      openAddUserModal() {
        if (!this.hasPermission('manage_users')) {
          alert('Access Denied: Only Admin account can create new users.');
          return;
        }

        const m = document.getElementById('modalContainer');
        m.classList.remove('hidden');
        m.innerHTML = `
          <div class="white-card modal-enter w-full max-w-md rounded-2xl p-6 border border-slate-200 space-y-4 bg-white shadow-2xl">
            <h3 class="font-bold text-lg text-slate-900">Add System User & Assign Access Level</h3>
            <form id="newUserForm" class="space-y-3 text-xs">
              <input type="text" id="uName" placeholder="Full Name" class="white-input w-full p-2.5 rounded-xl" required>
              <div class="grid grid-cols-2 gap-2">
                <input type="text" id="uUsername" placeholder="Username" class="white-input w-full p-2.5 rounded-xl font-mono" required>
                <input type="password" id="uPassword" placeholder="Password" class="white-input w-full p-2.5 rounded-xl font-mono" required>
              </div>
              <input type="email" id="uEmail" placeholder="Email Address" class="white-input w-full p-2.5 rounded-xl" required>
              
              <div>
                <label class="block text-slate-700 font-bold mb-1">Select Access Permission Level *</label>
                <select id="uAccessLevel" class="white-input w-full p-2.5 rounded-xl font-bold text-sky-800">
                  <option value="modification">&#9999;&#65039; Limited Access (Add New Instruments & Upload PDF - Edit/Delete Restricted to Admin)</option>
                  <option value="view">&#128065;&#65039; View Only Access (Read-Only Compliance View)</option>
                  <option value="admin">&#128081; Full Admin Control (Unrestricted Access)</option>
                </select>
              </div>

              <div class="flex justify-end space-x-2 pt-2">
                <button type="button" onclick="document.getElementById('modalContainer').classList.add('hidden')" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 border border-slate-200 font-bold">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md">&#128190; Save User Account</button>
              </div>
            </form>
          </div>
        `;

        document.getElementById('newUserForm').addEventListener('submit', (e) => {
          e.preventDefault();

          const accessLevel = document.getElementById('uAccessLevel').value;
          const isView = (accessLevel === 'view');
          const isAdmin = (accessLevel === 'admin');

          this.state.users.push({
            id: `USR-${Date.now()}`, 
            name: document.getElementById('uName').value.trim(),
            username: document.getElementById('uUsername').value.trim(), 
            password: document.getElementById('uPassword').value.trim(),
            email: document.getElementById('uEmail').value.trim(), 
            role: isAdmin ? 'Admin' : (isView ? 'Auditor' : 'Technician'),
            department: 'Metrology Dept', 
            avatar: 'MK',
            permissions: {
              accessLevel: accessLevel,
              canAddInstruments: !isView,
              canEditInstruments: isAdmin,
              canDeleteInstruments: isAdmin,
              canUploadExcel: !isView,
              canUploadPDF: !isView,
              canEditAgencies: isAdmin,
              canManageUsers: isAdmin,
              readOnlyMode: isView
            }
          });

          this.saveState('users');
          showToast(`&#128190; User Account ${document.getElementById('uUsername').value} Created & Saved!`);
          m.classList.add('hidden');
          this.renderCurrentTab();
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => { window.app = new CalibGuardApp(); });
  </script>
</body>
</html>
